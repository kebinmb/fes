spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    primary:
      jdbc-url: jdbc:mysql://localhost:3306/syndicateadmin_faculty_evaluation_db_prod?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
      username: ${DEV_DB_USERNAME:root}
      password: ${DEV_DB_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver

    legacy-talisay:
      jdbc-url: jdbc:mysql://localhost:3306/sisdatabase?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      username: ${DEV_LEGACY_DB_USERNAME:root}
      password: ${DEV_LEGACY_DB_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver

    legacy-alijis:
      jdbc-url: jdbc:mysql://localhost:3306/sisdatabase_alijis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      username: ${DEV_LEGACY_DB_USERNAME:root}
      password: ${DEV_LEGACY_DB_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver

    legacy-binalbagan:
      jdbc-url: jdbc:mysql://localhost:3306/sisdatabase_binalbagan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      username: ${DEV_LEGACY_DB_USERNAME:root}
      password: ${DEV_LEGACY_DB_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver

    legacy-ft:
      jdbc-url: jdbc:mysql://localhost:3306/sisdatabase_ft?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      username: ${DEV_LEGACY_DB_USERNAME:root}
      password: ${DEV_LEGACY_DB_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver

    authentication:
      jdbc-url: jdbc:mysql://localhost:3306/syndicateadmin_sis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
      username: ${DEV_AUTHENTICATION_DB_USERNAME:root}
      password: ${DEV_AUTHENTICATION_DB_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      jdbc:
        batch_size: 1000
      order_inserts: true
      order_updates: true
      ddl-auto: validate

    show-sql: false

  flyway:
    clean-disabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
            scope:
              - email
              - profile

email:
  accounts:
    - username: fes-noreply@chmsu.edu.ph
      password: ${MAIL_PASSWORD:}

    - username: fes1-noreply@chmsu.edu.ph
      password: ${MAIL_PASSWORD_2:}

  smtp:
    host: smtp.gmail.com
    port: 587
    auth: true
    starttls: true

app:
  oauth2:
    redirect-url-success: "http://localhost:4200/oauth-success"
    redirect-url-failure: "http://localhost:4200/oauth-failure"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.security: INFO

server:
  port: 8090

jwt:
  secret: ${JWT_SECRET:dev-only-change-this-secret-before-sharing}
  expiration: 900000
  refresh-expiration: 604800000
  idle-timeout: ${JWT_IDLE_TIMEOUT:600000}
  cookie-secure: false
  cookie-same-site: Lax

management:
  endpoint:
    health:
      show-details: always
