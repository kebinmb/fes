spring:
  application:
    name: faculty-evaluation-system

  profiles:
    active: dev

  session:
    store-type: none
    jdbc:
      initialize-schema: never

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

server:
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Custom migration toggle (your existing)
migration:
  enabled: true

# JWT (shared defaults)
jwt:
  secret: ${JWT_SECRET:411733b1bfc19f809225035fc41a53f98e34a2f149adf9e85e4063edf304b8db0179633d70b31db7ed97faa2c1181bdc}
  expiration: 900000
  refresh-expiration: 86400000