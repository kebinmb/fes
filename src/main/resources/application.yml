spring:
  application:
    name: faculty-evaluation-system
  profiles:
    active: dev
  session:
    store-type: none
    jdbc:
      initialize-schema: never

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

server:
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Custom migration toggle (your existing)
migration:
  enabled: true

# JWT (shared defaults)
jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 86400000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
