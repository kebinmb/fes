spring:
  application:
    name: faculty-evaluation-system
  profiles:
    active: dev
  session:
    store-type: none
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: ${EVIDENCE_MAX_FILE_SIZE:15MB}
      max-request-size: ${EVIDENCE_MAX_REQUEST_SIZE:16MB}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

server:
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Custom migration toggle (your existing)
migration:
  enabled: true

# JWT (shared defaults)
jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 86400000

app:
  evidence:
    max-file-size: ${EVIDENCE_MAX_FILE_SIZE:15MB}
    storage-provider: ${EVIDENCE_STORAGE_PROVIDER:google-drive}
    storage-dir: ${EVIDENCE_STORAGE_DIR:local-data/evidences}
    google-drive:
      credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:}
      folder-id: ${GOOGLE_DRIVE_FOLDER_ID:1S2rfDVrHmKf5LXKnERHcXE4rIWjVqkK-}
      token-uri: ${GOOGLE_DRIVE_TOKEN_URI:https://oauth2.googleapis.com/token}
      files-uri: ${GOOGLE_DRIVE_FILES_URI:https://www.googleapis.com/drive/v3/files}
      upload-uri: ${GOOGLE_DRIVE_UPLOAD_URI:https://www.googleapis.com/upload/drive/v3/files}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
