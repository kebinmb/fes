      username: syndicateadmin_sis
      password: ${AUTHENTICATION_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: FacultyEvaluationHikariPool

      maximum-pool-size: 6
      minimum-idle: 1

      idle-timeout: 30000
      connection-timeout: 60000
      validation-timeout: 5000

      max-lifetime: 60000
      keepalive-time: 15000

      leak-detection-threshold: 120000

      auto-commit: true

  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 25
        keep-alive: 60s

  mail:
    host: smtp.gmail.com
    port: 587
    username: fes-noreply@chmsu.edu.ph
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true

          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  cache:
    type: caffeine

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:

    hibernate:
      ddl-auto: none

    show-sql: true
    open-in-view: false

    properties:

      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

        format_sql: true

        boot:
          allow_jdbc_metadata_access: false

        temp:
          use_jdbc_metadata_defaults: false

        jdbc:
          batch_size: 25
          fetch_size: 25
          batch_versioned_data: true

        order_inserts: true
        order_updates: true

        generate_statistics: false

  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

            scope:
              - email
              - profile
app:
  oauth2:
    redirect-url-success: "${OAUTH2_REDIRECT_URL_SUCCESS:http://localhost:4200/oauth-success}"
    redirect-url-failure: "${OAUTH2_REDIRECT_URL_FAILURE:http://localhost:4200/oauth-failure}"

server:
  port: 9200
  forward-headers-strategy: framework
  tomcat:

    threads:
      max: 200
      min-spare: 10

    max-connections: 1000

    accept-count: 100

    connection-timeout: 20000

    keep-alive-timeout: 15000

    max-keep-alive-requests: 100

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.orm.jdbc.bind: TRACE
      org.springframework.orm.jpa: DEBUG
      org.springframework.transaction: DEBUG

management:

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
