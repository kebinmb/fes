spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    primary:
      jdbc-url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true&tcpKeepAlive=true&connectTimeout=3000&socketTimeout=600000
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

    legacy-talisay:
      jdbc-url: jdbc:mysql://${LEGACY_TALISAY_DB_HOST:${LEGACY_DB_HOST}}:${LEGACY_TALISAY_DB_PORT:${LEGACY_DB_PORT:3306}}/${LEGACY_TALISAY_DB_NAME:sisdatabase}?useSSL=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=false&tcpKeepAlive=true&connectTimeout=3000&socketTimeout=600000
      username: ${LEGACY_TALISAY_DB_USERNAME:${LEGACY_DB_USERNAME:ict}}
      password: ${LEGACY_TALISAY_DB_PASSWORD:${LEGACY_DB_PASSWORD}}
      driver-class-name: com.mysql.cj.jdbc.Driver

      hikari:
        initialization-fail-timeout: -1
        connection-timeout: 3000
        validation-timeout: 3000
        maximum-pool-size: 2
        minimum-idle: 0
        idle-timeout: 10000
        max-lifetime: 30000
        keepalive-time: 15000

    legacy-alijis:
      jdbc-url: jdbc:mysql://${LEGACY_ALIJIS_DB_HOST:${LEGACY_DB_HOST}}:${LEGACY_ALIJIS_DB_PORT:${LEGACY_DB_PORT:3306}}/${LEGACY_ALIJIS_DB_NAME:sisdatabase_alijis}?useSSL=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=false&tcpKeepAlive=true&connectTimeout=3000&socketTimeout=600000
      username: ${LEGACY_ALIJIS_DB_USERNAME:${LEGACY_DB_USERNAME:ict}}
      password: ${LEGACY_ALIJIS_DB_PASSWORD:${LEGACY_DB_PASSWORD}}
      driver-class-name: com.mysql.cj.jdbc.Driver

      hikari:
        initialization-fail-timeout: -1
        connection-timeout: 3000
        validation-timeout: 3000
        maximum-pool-size: 2
        minimum-idle: 0
        idle-timeout: 10000
        max-lifetime: 30000
        keepalive-time: 15000

    legacy-binalbagan:
      jdbc-url: jdbc:mysql://${LEGACY_BINALBAGAN_DB_HOST:${LEGACY_DB_HOST}}:${LEGACY_BINALBAGAN_DB_PORT:${LEGACY_DB_PORT:3306}}/${LEGACY_BINALBAGAN_DB_NAME:sisdatabase_binalbagan}?useSSL=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=false&tcpKeepAlive=true&connectTimeout=3000&socketTimeout=600000
      username: ${LEGACY_BINALBAGAN_DB_USERNAME:${LEGACY_DB_USERNAME:ict}}
      password: ${LEGACY_BINALBAGAN_DB_PASSWORD:${LEGACY_DB_PASSWORD}}
      driver-class-name: com.mysql.cj.jdbc.Driver

      hikari:
        initialization-fail-timeout: -1
        connection-timeout: 3000
        validation-timeout: 3000
        maximum-pool-size: 2
        minimum-idle: 0
        idle-timeout: 10000
        max-lifetime: 30000
        keepalive-time: 15000

    legacy-ft:
      jdbc-url: jdbc:mysql://${LEGACY_FT_DB_HOST:${LEGACY_DB_HOST}}:${LEGACY_FT_DB_PORT:${LEGACY_DB_PORT:3306}}/${LEGACY_FT_DB_NAME:sisdatabase_ft}?useSSL=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=false&tcpKeepAlive=true&connectTimeout=3000&socketTimeout=600000
      username: ${LEGACY_FT_DB_USERNAME:${LEGACY_DB_USERNAME:ict}}
      password: ${LEGACY_FT_DB_PASSWORD:${LEGACY_DB_PASSWORD}}
      driver-class-name: com.mysql.cj.jdbc.Driver

      hikari:
        initialization-fail-timeout: -1
        connection-timeout: 3000
        validation-timeout: 3000
        maximum-pool-size: 2
        minimum-idle: 0
        idle-timeout: 10000
        max-lifetime: 30000
        keepalive-time: 15000

    authentication:
      jdbc-url: jdbc:mysql://${AUTH_DB_HOST}:${AUTH_DB_PORT:3306}/${AUTH_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
      username: ${AUTH_DB_USERNAME}
      password: ${AUTHENTICATION_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: FacultyEvaluationHikariPool

      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}

      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 5000

      max-lifetime: 60000
      keepalive-time: 15000

      leak-detection-threshold: 120000

      auto-commit: true

  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 25
        keep-alive: 60s

  cache:
    type: caffeine

  servlet:
    multipart:
      max-file-size: ${EVIDENCE_MAX_FILE_SIZE:15MB}
      max-request-size: ${EVIDENCE_MAX_REQUEST_SIZE:16MB}

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

        boot:
          allow_jdbc_metadata_access: false

        temp:
          use_jdbc_metadata_defaults: false

        jdbc:
          batch_size: 25
          fetch_size: 25
          batch_versioned_data: true

        order_inserts: true
        order_updates: true

        generate_statistics: false

  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

email:
  accounts:
    - username: ${MAIL_USERNAME_1:fes-noreply@chmsu.edu.ph}
      password: ${MAIL_PASSWORD}

    - username: ${MAIL_USERNAME_2:fes1-noreply@chmsu.edu.ph}
      password: ${MAIL_PASSWORD_2}

  smtp:
    host: ${MAIL_SMTP_HOST:smtp.gmail.com}
    port: ${MAIL_SMTP_PORT:587}
    auth: ${MAIL_SMTP_AUTH:true}
    starttls: ${MAIL_SMTP_STARTTLS:true}

app:
  oauth2:
    redirect-url-success: ${OAUTH2_REDIRECT_URL_SUCCESS:https://feva.chmsu.edu.ph/oauth-success}
    redirect-url-failure: ${OAUTH2_REDIRECT_URL_FAILURE:https://feva.chmsu.edu.ph/oauth-failure}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dev-feva.chmsu.edu.ph,https://feva.chmsu.edu.ph}
  evidence:
    max-file-size: ${EVIDENCE_MAX_FILE_SIZE:15MB}
    storage-provider: ${EVIDENCE_STORAGE_PROVIDER:google-drive}
    storage-dir: ${EVIDENCE_STORAGE_DIR:local-data/evidences}
    google-drive:
      credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:}
      folder-id: ${GOOGLE_DRIVE_FOLDER_ID:1S2rfDVrHmKf5LXKnERHcXE4rIWjVqkK-}
      token-uri: ${GOOGLE_DRIVE_TOKEN_URI:https://oauth2.googleapis.com/token}
      files-uri: ${GOOGLE_DRIVE_FILES_URI:https://www.googleapis.com/drive/v3/files}
      upload-uri: ${GOOGLE_DRIVE_UPLOAD_URI:https://www.googleapis.com/upload/drive/v3/files}

server:
  port: ${SERVER_PORT:9200}
  forward-headers-strategy: framework

  tomcat:
    threads:
      max: 200
      min-spare: 10

    max-connections: 1000
    accept-count: 100
    connection-timeout: 20000
    keep-alive-timeout: 15000
    max-keep-alive-requests: 100

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.error: DEBUG
    org.springframework.security: WARN
    com.zaxxer.hikari: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  idle-timeout: ${JWT_IDLE_TIMEOUT:600000}
  cookie-secure: ${JWT_COOKIE_SECURE:true}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:None}
