spring:
  datasource:
    ...

  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 25
        keep-alive: 60s

  cache:
    type: caffeine

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false

        boot:
          allow_jdbc_metadata_access: false

        temp:
          use_jdbc_metadata_defaults: false

        jdbc:
          batch_size: 25
          fetch_size: 25
          batch_versioned_data: true

        order_inserts: true
        order_updates: true

        generate_statistics: false

  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

email:
  accounts:
    - username: fes-noreply@chmsu.edu.ph
      password: ${MAIL_PASSWORD}

    - username: fes1-noreply@chmsu.edu.ph
      password: ${MAIL_PASSWORD_2}

  smtp:
    host: smtp.gmail.com
    port: 587
    auth: true
    starttls: true

app:
  oauth2:
    redirect-url-success: ${OAUTH2_REDIRECT_URL_SUCCESS:http://localhost:4200/oauth-success}
    redirect-url-failure: ${OAUTH2_REDIRECT_URL_FAILURE:http://localhost:4200/oauth-failure}

server:
  port: 9200
  forward-headers-strategy: framework

  tomcat:
    threads:
      max: 200
      min-spare: 10

    max-connections: 1000
    accept-count: 100
    connection-timeout: 20000
    keep-alive-timeout: 15000
    max-keep-alive-requests: 100

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.error: DEBUG
    org.springframework.security: WARN
    com.zaxxer.hikari: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}