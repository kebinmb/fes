    hikari:
      pool-name: FacultyEvaluationHikariPool
      maximum-pool-size: 100
      minimum-idle: 20
      idle-timeout: 300000
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
      keepalive-time: 30000
      leak-detection-threshold: 60000
      auto-commit: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: fes-noreply@chmsu.edu.ph
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  cache:
    type: caffeine

  task:
    execution:
      pool:
        core-size: 50
        max-size: 200
        queue-capacity: 1000
        keep-alive: 60s

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false
        jdbc:
          batch_size: 1000
          fetch_size: 100
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false

  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: true

server:
  port: 9000
  forward-headers-strategy: framework

  tomcat:
    threads:
      max: 1000
      min-spare: 50

    max-connections: 10000
    accept-count: 1000

    connection-timeout: 20000
    keep-alive-timeout: 15000
    max-keep-alive-requests: 100

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.error: DEBUG
    org.springframework.security: WARN
    com.zaxxer.hikari: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}